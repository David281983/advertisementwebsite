
services:
###> doctrine/doctrine-bundle ###
  db:
    image: mariadb:10.8.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: adsproject
    ports:
      - 3306:3306
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
